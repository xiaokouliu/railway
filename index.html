<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>事故隐患速报</title>
    <style>
        /* 基础样式保持与之前一致，此处省略重复，只列出新增部分 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; display: flex; justify-content: center; padding: 16px 12px 30px; }
        .container { max-width: 420px; width: 100%; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,20,50,0.08); padding: 20px 18px 24px; position: relative; }
        /* ... 其他样式与之前完全相同，此处省略以节省篇幅，实际使用时复制完整样式 ... */
        /* 但必须包含以下两个类： */
        .hidden { display: none !important; }
        .thanks-page {
            text-align: center;
            padding: 40px 20px;
        }
        .thanks-page .icon { font-size: 64px; margin-bottom: 20px; }
        .thanks-page .title { font-size: 24px; font-weight: 600; color: #1a3a5c; margin-bottom: 12px; }
        .thanks-page .desc { font-size: 16px; color: #6c8db0; line-height: 1.6; }
        .thanks-page .close-hint { margin-top: 30px; font-size: 14px; color: #8a9fb0; background: #f0f4fa; padding: 8px 16px; border-radius: 20px; }
        /* 其余原有样式继续保留 */
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- 头部 -->
    <div class="header">
        <div class="header-title">事故隐患速报<span style="font-weight:400;font-size:14px;color:#6c8db0;margin-left:4px;">随手拍</span></div>
        <div class="header-time" id="currentTime">11:38</div>
    </div>

    <!-- 表单区域 -->
    <div id="formArea">
        <!-- 表单内容与之前完全一样，省略重复 -->
        <form id="reportForm" onsubmit="return false;">
            <!-- 单位、车间、线路、时间、内容、图片上传、提交按钮等 -->
        </form>
        <div class="footer-note">— 信息仅本地处理，不存储 —</div>
    </div>

    <!-- 感谢区域（默认隐藏） -->
    <div id="thanksArea" class="thanks-page hidden">
        <div class="icon">✅</div>
        <div class="title">感谢提交！</div>
        <div class="desc">您的隐患信息已成功记录。</div>
        <div class="close-hint" id="closeHint">页面即将关闭……</div>
    </div>
</div>

<script>
    (function() {
        // 检测 URL 参数是否带有 ?thanks=1
        const urlParams = new URLSearchParams(window.location.search);
        const isThanks = urlParams.get('thanks') === '1';

        const formArea = document.getElementById('formArea');
        const thanksArea = document.getElementById('thanksArea');

        if (isThanks) {
            // 显示感谢页，隐藏表单
            formArea.classList.add('hidden');
            thanksArea.classList.remove('hidden');
            // 尝试关闭页面（仅作尝试）
            setTimeout(() => {
                try { window.close(); } catch(e) {}
                // 如果关闭失败，提示手动关闭
                document.getElementById('closeHint').textContent = '如页面未关闭，请手动关闭此标签页';
            }, 1500);
        } else {
            // 正常显示表单，初始化时间、字数统计、图片上传等（代码与之前相同）
            // 此处省略重复初始化，实际需保留所有初始化逻辑
        }

        // ---------- 提交事件 ----------
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.addEventListener('click', function() {
            const content = document.getElementById('content').value.trim();
            if (content === '') {
                alert('请填写事故隐患描述');
                return;
            }
            // 提交后跳转到同一页面，带上 ?thanks=1 参数
            window.location.href = window.location.pathname + '?thanks=1';
        });

        // 其他初始化（时间、字数、图片）保持不变……
        // 提醒：以上是核心改动，实际使用时需将原有所有JS代码整合进去。
    })();
</script>
</body>
</html>
